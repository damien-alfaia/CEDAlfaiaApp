name: Deploy to VPS

# Déclenché à la fin du workflow CI sur la branche modernization,
# uniquement si la CI a réussi. Permet aussi un déclenchement manuel.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [modernization]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH + bash deploy.sh
    runs-on: ubuntu-latest
    # `workflow_run` se déclenche aussi sur les CI failed → on filtre.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Run deploy.sh on VPS
        run: |
          ssh -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'bash /var/www/cedalfaia/deploy/deploy.sh'

      - name: Verify HTTPS
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" \
              "https://${{ secrets.APP_DOMAIN }}/login" --max-time 10 || echo 000)
            echo "[$i/5] /login -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "Healthcheck KO"
          exit 1
